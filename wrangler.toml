name = "certifiedproperty-home-inspection-repair"
main = "worker.js"
compatibility_date = "2026-09-21"

# The site's files are served straight from the repo root.
# .assetsignore keeps source files (worker, lib, README) out of the public bundle.
[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# RESEND_API_KEY is a SECRET, never put it here:
#   npx wrangler secret put RESEND_API_KEY
#
# These plain variables must stay listed here. Every deploy runs
# `wrangler deploy`, which makes this file the source of truth for [vars]
# and deletes any that exist only in the dashboard. Keep the two in sync.
[vars]
LEAD_TO = "certifiedpropertyservicesllc@gmail.com"
LEAD_FROM = "leads@technopho.com"
LEAD_PAGE = "Home Inspection Repairs Landing Page"
